name: ci

on:
  push:
    branches: [develop, main, "cursor/**"]
  pull_request:
    # Stacked PRs often target another feature branch; still run CI on those heads.
    branches: [develop, main, "cursor/**"]

permissions:
  contents: read

jobs:
  rust-portable:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: musehub
          POSTGRES_PASSWORD: musehub
          POSTGRES_DB: musehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://musehub:musehub@localhost:5432/musehub
      MUSEHUB_TEST_DATABASE_URL: postgres://musehub:musehub@localhost:5432/musehub
      MUSEHUB_GIT_ROOT: /tmp/musehub-ci-git
      MUSEHUB_ARTIFACT_ROOT: /tmp/musehub-ci-artifacts
      MUSEHUB_SESSION_SECRET: ci-session-secret-not-for-production
      MUSEHUB_BOOTSTRAP_ADMIN_PASSWORD: 'Ci-Bootstrap-Strong!2026'
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: MCP Python deps
        run: ./scripts/setup-mcp-matrix-python-deps.sh
      - name: systemd unit layout
        run: chmod +x ./scripts/verify-systemd-units.sh && ./scripts/verify-systemd-units.sh
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: migrate
        run: cargo run -p musehub-migrate -- up migrations "$DATABASE_URL"
      - name: Git SSH transport prerequisites
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo apt-get install -y -qq openssh-server git
          id git >/dev/null 2>&1 || sudo useradd -r -M -s /usr/sbin/nologin git
          sudo install -d -m 755 /run/sshd
          cargo build -p musehub-git-ssh -q && sudo install -m 0755 target/debug/musehub-git-ssh /usr/local/bin/musehub-git-ssh
      - name: build agent adapter binaries
        run: |
          cargo build -p musehub-agent-adapter --bin musehub-agent-reference -q
          cargo build -p musehub-agent-adapter --bin musehub-agent-codex-sim -q
          cargo build -p musehub-agent-adapter --bin musehub-agent-codex-fixture -q
          cargo build -p musehub-agent-adapter --bin musehub-pipeline-reference -q
          cargo build -p musehub-agent-adapter --bin musehub-pipeline-oci -q
          cargo build -p musehub-agent-adapter --bin musehub-compose-mock -q
          cargo build -p musehub-agent-adapter --bin musehub-compose-runner -q
      - name: portable tests
        run: ./scripts/cargo-test-portable.sh
      - name: dev local stack smoke
        run: |
          chmod +x ./scripts/dev-local-stack.sh ./scripts/lib/dev-local-pid.sh \
            ./scripts/verify-dev-local-pid-epoch.sh \
            ./scripts/verify-dev-local-stack.sh ./scripts/verify-dev-local-stack-negative.sh \
            ./scripts/verify-sed-portable.sh
          ./scripts/verify-dev-local-pid-epoch.sh
          ./scripts/verify-dev-local-stack-negative.sh
          ./scripts/verify-dev-local-stack.sh
      - name: product acceptance
        env:
          MUSEHUB_REQUIRE_GIT_SSH: "1"
          MUSEHUB_GIT_SSH_BIN: ${{ github.workspace }}/target/debug/musehub-git-ssh
        run: chmod +x ./scripts/verify-product-acceptance.sh && ./scripts/verify-product-acceptance.sh
      - name: backup restore verification
        run: chmod +x ./scripts/verify-backup-restore.sh && ./scripts/verify-backup-restore.sh
      - name: product security integration tests
        run: |
          chmod +x ./scripts/run-ci-security-integration-local.sh
          ./scripts/run-ci-security-integration-local.sh

  pipeline-oci-product:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: musehub
          POSTGRES_PASSWORD: musehub
          POSTGRES_DB: musehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://musehub:musehub@localhost:5432/musehub
      MUSEHUB_TEST_DATABASE_URL: postgres://musehub:musehub@localhost:5432/musehub
      MUSEHUB_GIT_ROOT: /tmp/musehub-oci-product-git
      MUSEHUB_ARTIFACT_ROOT: /tmp/musehub-oci-product-artifacts
      MUSEHUB_SESSION_SECRET: ci-oci-product-secret
      MUSEHUB_BOOTSTRAP_ADMIN_PASSWORD: 'Ci-Oci-Product-Strong!2026'
      MUSEHUB_OCI_REGISTRY: 127.0.0.1:5000
      MUSEHUB_REQUIRE_PIPELINE_OCI: "1"
      MUSEHUB_COMPOSE_ADAPTER_MODE: runner
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: pipeline OCI product acceptance
        run: |
          chmod +x ./scripts/verify-pipeline-oci-product-e2e.sh
          ./scripts/verify-pipeline-oci-product-e2e.sh

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: musehub
          POSTGRES_PASSWORD: musehub
          POSTGRES_DB: musehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://musehub:musehub@localhost:5432/musehub
      MUSEHUB_TEST_DATABASE_URL: postgres://musehub:musehub@localhost:5432/musehub
      MUSEHUB_GIT_ROOT: /tmp/musehub-web-e2e-git
      MUSEHUB_SESSION_SECRET: ci-web-e2e-session-secret-32chars
      MUSEHUB_BOOTSTRAP_ADMIN_PASSWORD: 'Ci-Web-E2E-Strong!2026'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: chmod +x ./scripts/yarn-install-retry.sh && ./scripts/yarn-install-retry.sh web
      - name: install Playwright Chromium (with OS deps)
        run: yarn --cwd web exec playwright install --with-deps chromium
      - name: build adapter binaries for server E2E
        run: |
          cargo build -p musehub-agent-adapter --bin musehub-agent-reference -q
          cargo build -p musehub-agent-adapter --bin musehub-pipeline-reference -q
          cargo build -p musehub-agent-adapter --bin musehub-pipeline-oci -q
          cargo build -p musehub-agent-adapter --bin musehub-compose-mock -q
          cargo build -p musehub-agent-adapter --bin musehub-compose-runner -q
          cargo build -p musehub-server -q
      - run: yarn --cwd web test
      - run: yarn --cwd web build
      - name: web browser E2E (Playwright)
        run: |
          chmod +x ./scripts/run-web-e2e.sh ./scripts/collect-e2e-diagnostics.sh
          ./scripts/run-web-e2e.sh

  compose-runner-e2e:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: compose-runner real acceptance
        run: |
          chmod +x ./scripts/verify-compose-runner-e2e.sh
          ./scripts/verify-compose-runner-e2e.sh

  product-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - name: product Docker stack E2E
        run: |
          chmod +x ./scripts/verify-product-stack-e2e.sh
          ./scripts/verify-product-stack-e2e.sh

  product-production-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKER_BUILDKIT: 0
      COMPOSE_DOCKER_CLI_BUILD: 0
    steps:
      - uses: actions/checkout@v4
      - name: production compose stack E2E (remote worker)
        run: |
          chmod +x ./scripts/verify-product-production-stack-e2e.sh
          export MUSEHUB_E2E_DOCKER_GROUP=1
          ./scripts/verify-product-production-stack-e2e.sh
