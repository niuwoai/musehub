[workspace]
resolver = "2"
members = [
    "crates/musehub-core",
    "crates/musehub-git-probe",
    "crates/musehub-runner-probe",
    "crates/musehub-container-probe",
    "crates/musehub-agent-probe",
    "crates/musehub-server",
]

[workspace.dependencies]
axum = "0.8"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
