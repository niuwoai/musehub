[workspace]
resolver = "2"
members = [
    "crates/musehub-core",
    "crates/musehub-git-probe",
    "crates/musehub-runner-probe",
    "crates/musehub-container-probe",
    "crates/musehub-rootless-probe",
    "crates/musehub-ssh-probe",
    "crates/musehub-agent-probe",
    "crates/musehub-migrate",
    "crates/musehub-server",
]

[workspace.dependencies]
axum = "0.8"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
